[project]
name = "visaguard"
version = "0.1.0"
description = "VisaGuard intake service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=46.0.5",
  "fastapi>=0.115.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=9.0.0",
  "python-multipart>=0.0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
